name: Deploy to DirectAdmin (FTP)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install & build
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

      - name: Assemble deploy folder
        run: |
          mkdir -p deploy/db
          cp -r .next deploy/.next
          rm -rf deploy/.next/cache deploy/.next/dev deploy/.next/types deploy/.next/trace
          cp -r dist deploy/dist
          if [ -d public ]; then cp -r public deploy/public; fi
          cp -r db/migrations deploy/db/migrations
          cp server.js package.json package-lock.json next.config.mjs deploy/
          echo "BUILD_ID=$(cat .next/BUILD_ID)" >> "$GITHUB_ENV"
          # node_modules is installed on the host (Node.js Selector -> Run NPM Install)

      - name: Upload via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: deploy/
          # Remote folder = Application root, e.g. apps/equiplog/ (must end with /)
          server-dir: ${{ secrets.FTP_DIR }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**

      # Add "[skip restart]" to a commit message when package.json dependencies changed:
      # run "Run NPM Install" in DirectAdmin first, then restart manually.
      # A green deploy means the NEW build answers on the site: the job fails if the restart is refused or the
      # live build never becomes the one just uploaded (so "green but still the old site" cannot happen silently).
      - name: Restart app and verify the new build is live
        if: ${{ !contains(github.event.head_commit.message, '[skip restart]') }}
        env:
          RESTART_TOKEN: ${{ secrets.RESTART_TOKEN }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          if [ -z "$RESTART_TOKEN" ] || [ -z "$SITE_URL" ]; then
            echo "::warning::RESTART_TOKEN/SITE_URL not set - restart the app manually in DirectAdmin and check the site"; exit 0
          fi
          curl -fsS -m 30 -X POST -H "x-restart-token: $RESTART_TOKEN" "$SITE_URL/api/v1/internal/restart"
          echo
          for i in $(seq 1 24); do
            sleep 5
            live=$(curl -fsS -m 20 "$SITE_URL/api/v1/health" 2>/dev/null | sed -n 's/.*"build":"\([^"]*\)".*/\1/p' || true)
            echo "check $i: live build='$live' expected='$BUILD_ID'"
            if [ "$live" = "$BUILD_ID" ]; then echo "New build is live."; exit 0; fi
          done
          echo "::error::The site did not come back on build $BUILD_ID within 2 minutes. Restart the app in DirectAdmin and check the site."
          exit 1
