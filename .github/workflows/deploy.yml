name: Deploy to DirectAdmin (FTP)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install & build
        run: |
          npm ci
          npm run build

      - name: Assemble deploy folder
        run: |
          mkdir deploy
          cp -r .next/standalone/. deploy/
          mkdir -p deploy/.next
          cp -r .next/static deploy/.next/static
          cp -r public deploy/public
          # node_modules is installed on the host (Node.js Selector -> Run NPM Install)
          rm -rf deploy/node_modules

      - name: Upload via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: deploy/
          # Remote folder = Application root, e.g. apps/equiplog/ (must end with /)
          server-dir: ${{ secrets.FTP_DIR }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**

      - name: Restart app
        env:
          RESTART_TOKEN: ${{ secrets.RESTART_TOKEN }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          if [ -z "$RESTART_TOKEN" ] || [ -z "$SITE_URL" ]; then
            echo "RESTART_TOKEN/SITE_URL not set - restart the app manually in DirectAdmin"; exit 0
          fi
          curl -sS -m 30 -X POST -H "x-restart-token: $RESTART_TOKEN" "$SITE_URL/api/restart" || true
          sleep 5
          curl -sS -m 60 "$SITE_URL/api/health" || true
